services:
  postgres:
    image: postgres:16
    container_name: pungoe_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pungoe_network

  app:
    build:
      context: .
      dockerfile: Dockerfile.nextjs
    env_file:
      - .env
    container_name: pungoe_app
    depends_on:
      postgres:
        condition: service_healthy
      kali-tools:
        condition: service_started
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - ./uploads:/app/uploads
    environment:
      STUDIO_EMBED_BUILD: false
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # Nama env harus KALI_TOOLS (route.ts membaca process.env.KALI_TOOLS)
      KALI_TOOLS: http://kali-tools:5000
      # Kunci internal opsional (kirim ke Flask lewat header X-Internal-Key).
      # Aktif hanya bila di-set di file .env pada kedua service.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    networks:
      - pungoe_network
    restart: unless-stopped

  kali-tools:
    build:
      context: .
      dockerfile: Dockerfile.kali
    env_file:
      - .env
    container_name: pungoe_kali_tools
    hostname: kali-tools
    # Port 5000 TIDAK dipublish ke host. Backend hanya bisa diakses dari dalam
    # jaringan Docker (oleh service `app`), sehingga tidak bisa melewati auth Next.js.
    # Untuk debugging lokal, buka sementara dengan: "127.0.0.1:5000:5000".
    expose:
      - "5000"
    volumes:
      - ./kali-tools:/app
      - ./uploads:/app/uploads
    environment:
      FLASK_ENV: production
      POSTGRES_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      # Bila di-set, Flask mewajibkan header X-Internal-Key yang cocok pada semua request.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    networks:
      - pungoe_network
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW

volumes:
  postgres_data:

networks:
  pungoe_network:
    driver: bridge
